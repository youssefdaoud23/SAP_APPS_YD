services:
  postgres:
    image: postgres:17-alpine
    container_name: invarture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: invarture
      POSTGRES_USER: invarture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invarture_dev_change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invarture -d invarture"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  invarture-app-studio:
    build: .
    container_name: invarture-app-studio
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8081"
      WORKSPACE_STORAGE: ${WORKSPACE_STORAGE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://invarture:${POSTGRES_PASSWORD:-invarture_dev_change_me}@postgres:5432/invarture}
      WORKSPACE_FILE: /app/data/workspace.json
    volumes:
      - app-studio-data:/app/data

volumes:
  app-studio-data:
  postgres-data:
