services:
  invarture-app-studio:
    build: .
    container_name: invarture-app-studio
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8081"
      WORKSPACE_FILE: /app/data/workspace.json
    volumes:
      - app-studio-data:/app/data

volumes:
  app-studio-data:
