<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#2f3748" />
<title>Invarture App Studio</title>
<style>
:root{--navy:#2f3748;--navy2:#222a38;--blue:#377cf6;--bg:#f4f6fa;--surface:#fff;--border:#dfe4ed;--text:#202735;--muted:#687387;--green:#168a62;--amber:#b87900;--red:#c83d4b;--shadow:0 12px 32px rgba(32,39,53,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.sidebar{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:18px}.brand{padding:5px 8px 14px;border-bottom:1px solid rgba(255,255,255,.1)}.brand img{width:150px;filter:brightness(0) invert(1)}.brand small{display:block;margin-top:5px;color:rgba(255,255,255,.65);letter-spacing:.08em;text-transform:uppercase}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:rgba(255,255,255,.78);padding:11px 12px;border-radius:9px;text-align:left}.nav button:hover,.nav button.active{background:rgba(55,124,246,.22);color:#fff}.sidebar-footer{margin-top:auto;padding:12px 9px;color:rgba(255,255,255,.62);font-size:12px;line-height:1.5}.main{min-width:0}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}.topbar h1{font-size:19px}.pill{background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:8px 12px;font-size:13px;color:var(--muted)}.content{padding:24px}.btn{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:9px;padding:9px 12px;font-weight:650}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.small{padding:6px 8px;font-size:12px}.btn.danger{color:var(--red)}.hero{background:linear-gradient(125deg,var(--navy),#394b68 68%,var(--blue));color:#fff;border-radius:20px;padding:30px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:var(--shadow)}.hero h2{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:rgba(255,255,255,.76);max-width:720px;line-height:1.6}.hero-stat{padding:14px 18px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);border-radius:14px;text-align:center}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.section h2{margin:0;font-size:19px}.grid{display:grid;gap:16px}.apps{grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}.card{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 5px 16px rgba(32,39,53,.04)}.app-card{padding:18px;display:flex;flex-direction:column;gap:14px;min-height:180px}.app-icon{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:#e9f1ff;color:var(--blue);font-size:20px}.app-card h3{margin:0;font-size:16px}.app-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45;flex:1}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.status{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}.published{background:#e6f7f0;color:var(--green)}.draft{background:#fff4de;color:var(--amber)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar .name{margin-right:auto;font-weight:700}.studio{display:grid;grid-template-columns:220px minmax(420px,1fr) 290px;gap:14px;min-height:680px}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;min-width:0}.panel-head{padding:13px 14px;border-bottom:1px solid var(--border);background:#fbfcfe;font-weight:700;font-size:14px}.panel-body{padding:14px}.palette{display:grid;grid-template-columns:1fr 1fr;gap:8px}.palette button{border:1px solid var(--border);background:#fff;border-radius:10px;padding:12px 8px}.palette button:hover{border-color:var(--blue);color:var(--blue);background:#f7faff}.palette b{display:block;font-size:20px;margin-bottom:5px}.canvas{display:flex;flex-direction:column}.canvas-tools{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);background:#fbfcfe}.devices{margin-left:auto;display:flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden}.devices button{border:0;background:transparent;padding:6px 9px;font-size:12px;color:var(--muted)}.devices button.active{background:#fff;color:var(--blue)}.stage{background:#e9edf4;padding:24px;flex:1;overflow:auto}.page{background:#fff;min-height:560px;width:100%;margin:auto;border:1px solid #d7dce6;border-radius:12px;box-shadow:0 18px 40px rgba(32,39,53,.11);overflow:hidden;transition:max-width .2s}.page.tablet{max-width:780px}.page.mobile{max-width:390px}.runtime-head{height:52px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.canvas-content{padding:20px;min-height:500px}.component{position:relative;border:1px solid transparent;border-radius:8px;padding:7px;margin:3px 0}.component:hover{border-color:#bcd1fa}.component.selected{border-color:var(--blue);background:#f5f9ff}.comp-actions{position:absolute;right:5px;top:5px;display:none;gap:3px;z-index:3}.component.selected .comp-actions{display:flex}.comp-actions button{width:24px;height:24px;padding:0;border:1px solid var(--border);background:#fff;border-radius:6px}.c-title{font-size:25px;font-weight:800;margin:4px 0 8px}.c-text{color:#4e586a;line-height:1.55}.c-button{display:inline-block;background:var(--blue);color:#fff;padding:9px 14px;border-radius:8px;font-weight:700}.fake label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.fake div{border:1px solid var(--border);border-radius:8px;height:38px;padding:9px 10px;color:#98a1b2}.box{border:1px solid var(--border);border-radius:11px;padding:15px;background:#fff}.kpi{display:flex;align-items:flex-end;justify-content:space-between;padding:14px;border:1px solid var(--border);border-radius:11px}.kpi .value{font-size:28px;font-weight:800;color:var(--navy)}.kpi .label{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}.table{overflow:auto;border:1px solid var(--border);border-radius:10px}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}.table th{background:#f6f8fb}.empty{min-height:380px;display:grid;place-items:center;color:var(--muted);text-align:center;border:2px dashed #cbd3e1;border-radius:12px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;font-weight:700;color:#536078}.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:8px;padding:9px 10px;width:100%;background:#fff}.field textarea{min-height:80px;resize:vertical}.hint{font-size:12px;color:var(--muted);line-height:1.45}.notice{border:1px solid #cfe0ff;background:#f4f8ff;color:#35527f;border-radius:10px;padding:11px 12px;font-size:12px;line-height:1.5}.sources{display:grid;grid-template-columns:360px 1fr;gap:16px}.source-card{padding:18px}.connection{padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#9da6b6;display:inline-block;margin-right:6px}.dot.ok{background:var(--green)}.modal-bg{position:fixed;inset:0;background:rgba(15,21,31,.64);z-index:100;display:grid;place-items:center;padding:24px}.modal{background:#fff;width:min(1180px,96vw);height:min(760px,92vh);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3)}.modal-head{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.modal-body{flex:1;background:#e8ecf2;padding:22px;overflow:auto}.preview{max-width:1080px;min-height:100%;margin:auto;background:#fff;box-shadow:var(--shadow)}.toast{position:fixed;right:20px;bottom:20px;z-index:200;background:var(--navy);color:#fff;padding:11px 14px;border-radius:9px;box-shadow:var(--shadow);font-size:13px}@media(max-width:1100px){.studio{grid-template-columns:190px 1fr}.studio>.panel:last-child{grid-column:1/-1}.sources{grid-template-columns:1fr}}@media(max-width:780px){.shell{grid-template-columns:1fr}.sidebar{display:none}.content{padding:14px}.studio{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="app"></div><input id="importFile" type="file" accept="application/json" hidden />
<script>
const LOGO='https://www.invarture.com/wp-content/uploads/2017/07/logo-invarture-erp-sap-normal.png',KEY='invarture-studio-mvp-v1';
const base={view:'launchpad',device:'desktop',selected:null,current:'purchase-orders',connections:[{id:'demo-sap',name:'SAP Demo',type:'OData V2',url:'https://sap.example.local/sap/opu/odata/sap/',status:'demo'}],apps:[{id:'purchase-orders',name:'Purchase Orders',description:'Demo SAP procurement workspace built with Invarture App Studio.',status:'published',components:[{id:'c1',type:'title',text:'Purchase Orders'},{id:'c2',type:'text',text:'Monitor open purchase orders and supplier activity.'},{id:'c3',type:'kpi',label:'Open purchase orders',value:'128'},{id:'c4',type:'table',columns:'PO,Vendor,Amount,Status'}]},{id:'employee-directory',name:'Employee Directory',description:'Starter HR application showing reusable business components.',status:'draft',components:[{id:'e1',type:'title',text:'Employee Directory'},{id:'e2',type:'input',label:'Search employee',placeholder:'Name or personnel number'},{id:'e3',type:'button',text:'Search'}]}]};
let state=load(),modal=null;function load(){try{return {...JSON.parse(JSON.stringify(base)),...JSON.parse(localStorage.getItem(KEY))}}catch{return JSON.parse(JSON.stringify(base))}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function app(){return state.apps.find(x=>x.id===state.current)||state.apps[0]}function uid(p='c'){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(s){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),1800)}
const nav={launchpad:'▦ Launchpad',studio:'✦ App Studio',data:'⇄ Data Sources',projects:'◫ Applications',settings:'⚙ Settings'};
function render(){document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><img src="${LOGO}" alt="Invarture"><small>App Studio</small></div><nav class="nav">${Object.entries(nav).map(([k,v])=>`<button data-nav="${k}" class="${state.view===k?'active':''}">${v}</button>`).join('')}</nav><div class="sidebar-footer">Invarture SAP application platform<br>MVP test build · local-first</div></aside><main class="main"><header class="topbar"><h1>${nav[state.view].replace(/^.. /,'')}</h1><span class="pill">Test workspace</span></header><section class="content">${view()}</section></main></div>${modal?previewModal():''}`;wire()}
function view(){return state.view==='studio'?studio():state.view==='data'?dataSources():state.view==='projects'?projects():state.view==='settings'?settings():launchpad()}
function launchpad(){return `<div class="hero"><div><h2>Build SAP business apps faster</h2><p>A working clean-room proof of concept for the Neptune-style workflow: application composition, live preview, reusable components, data-source configuration and a launchpad.</p></div><div class="hero-stat"><strong style="font-size:24px">${state.apps.length}</strong><br><small>Applications</small></div></div><div class="section"><h2>Applications</h2><button class="btn primary" data-new>+ New application</button></div><div class="grid apps">${state.apps.map(card).join('')}</div>`}
function card(a){return `<article class="card app-card"><div class="app-icon">▤</div><div><h3>${esc(a.name)}</h3><p>${esc(a.description)}</p></div><div class="meta"><span class="status ${a.status}">${a.status}</span><span>${a.components.length} components</span></div><div><button class="btn small primary" data-open="${a.id}">Open</button> <button class="btn small" data-preview="${a.id}">Preview</button></div></article>`}
function projects(){return `<div class="section" style="margin-top:0"><h2>Application registry</h2><button class="btn primary" data-new>+ New application</button></div><div class="card">${state.apps.map(a=>`<div class="connection"><div><strong>${esc(a.name)}</strong><div class="hint">${esc(a.description)}</div></div><div><span class="status ${a.status}">${a.status}</span> <button class="btn small" data-open="${a.id}">Edit</button> <button class="btn small" data-preview="${a.id}">Preview</button></div></div>`).join('')}</div>`}
function studio(){let a=app();return `<div class="toolbar"><span class="name">${esc(a.name)}</span><button class="btn small" data-act="save">Save</button><button class="btn small" data-act="export">Export JSON</button><button class="btn small" data-act="import">Import JSON</button><button class="btn small" data-act="publish">${a.status==='published'?'Unpublish':'Publish'}</button><button class="btn small primary" data-act="preview">▶ Preview</button></div><div class="studio"><section class="panel"><div class="panel-head">Components</div><div class="panel-body"><div class="palette">${pal('title','T','Title')}${pal('text','¶','Text')}${pal('button','▣','Button')}${pal('input','⌨','Input')}${pal('card','□','Card')}${pal('kpi','↗','KPI')}${pal('table','▤','Table')}${pal('spacer','↕','Spacer')}</div><p class="hint">Click to add. Select a canvas item to configure it.</p></div></section><section class="panel canvas"><div class="canvas-tools"><strong>Canvas</strong><span class="hint">${a.components.length} components</span><div class="devices">${['desktop','tablet','mobile'].map(d=>`<button data-device="${d}" class="${state.device===d?'active':''}">${d}</button>`).join('')}</div></div><div class="stage"><div class="page ${state.device==='desktop'?'':state.device}"><div class="runtime-head"><strong>${esc(a.name)}</strong><small>Invarture Runtime</small></div><div class="canvas-content">${a.components.length?a.components.map((c,i)=>component(c,i,true)).join(''):'<div class="empty">Add your first component from the palette.</div>'}</div></div></div></section><section class="panel"><div class="panel-head">Properties</div><div class="panel-body">${properties()}</div></section></div>`}
function pal(t,i,l){return `<button data-add="${t}"><b>${i}</b>${l}</button>`}
function component(c,i,edit){let b='';if(c.type==='title')b=`<div class="c-title">${esc(c.text||'Page title')}</div>`;if(c.type==='text')b=`<div class="c-text">${esc(c.text||'Text')}</div>`;if(c.type==='button')b=`<span class="c-button">${esc(c.text||'Button')}</span>`;if(c.type==='input')b=`<div class="fake"><label>${esc(c.label||'Input')}</label><div>${esc(c.placeholder||'Enter value')}</div></div>`;if(c.type==='card')b=`<div class="box"><strong>${esc(c.title||'Card')}</strong><div class="c-text" style="margin-top:6px">${esc(c.text||'Reusable content card')}</div></div>`;if(c.type==='kpi')b=`<div class="kpi"><div><div class="label">${esc(c.label||'KPI')}</div><div class="value">${esc(c.value||'0')}</div></div><strong style="color:var(--green)">+4.2%</strong></div>`;if(c.type==='table'){let cols=(c.columns||'ID,Name,Status').split(',').map(x=>x.trim()).filter(Boolean),rows=[['4500001281','ACME Components','€ 12,480','Open'],['4500001294','Contoso GmbH','€ 7,240','Approved'],['4500001302','Northwind SAS','€ 19,900','Open']];b=`<div class="table"><table><thead><tr>${cols.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map((_,j)=>`<td>${esc(r[j]||'Sample')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}if(c.type==='spacer')b=`<div style="height:${Number(c.height)||24}px"></div>`;return `<div class="component ${edit&&c.id===state.selected?'selected':''}" ${edit?`data-select="${c.id}"`:''}>${edit?`<div class="comp-actions"><button data-move="up" data-id="${c.id}">↑</button><button data-move="down" data-id="${c.id}">↓</button><button data-del="${c.id}">×</button></div>`:''}${b}</div>`}
function properties(){let a=app(),c=a.components.find(x=>x.id===state.selected);if(!c)return `<div class="hint">Select a component to edit it.</div><hr style="border:0;border-top:1px solid var(--border);margin:14px 0"><div class="field"><label>Application name</label><input data-appfield="name" value="${esc(a.name)}"></div><div class="field"><label>Description</label><textarea data-appfield="description">${esc(a.description)}</textarea></div>`;let f=[];if(['title','text','button'].includes(c.type))f.push(inp('text','Text',c.text));if(c.type==='input'){f.push(inp('label','Label',c.label));f.push(inp('placeholder','Placeholder',c.placeholder))}if(c.type==='card'){f.push(inp('title','Title',c.title));f.push(area('text','Content',c.text))}if(c.type==='kpi'){f.push(inp('label','Label',c.label));f.push(inp('value','Value',c.value))}if(c.type==='table'){f.push(inp('columns','Columns',c.columns));f.push(`<div class="field"><label>Data source</label><select data-prop="dataSource"><option value="">Sample data</option>${state.connections.map(x=>`<option value="${x.id}" ${c.dataSource===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`)}if(c.type==='spacer')f.push(inp('height','Height px',c.height||24,'number'));return `<div class="notice">${esc(c.type.toUpperCase())}</div><br>${f.join('')}<button class="btn danger" data-del="${c.id}">Delete component</button>`}
function inp(k,l,v,t='text'){return `<div class="field"><label>${l}</label><input type="${t}" data-prop="${k}" value="${esc(v||'')}"></div>`}function area(k,l,v){return `<div class="field"><label>${l}</label><textarea data-prop="${k}">${esc(v||'')}</textarea></div>`}
function dataSources(){return `<div class="sources"><section class="card source-card"><h3>Add SAP / API connection</h3><p class="hint">Register an endpoint for use by your applications.</p><div class="notice"><strong>Safe MVP mode:</strong> Validate checks configuration locally only. No credentials or requests are sent to SAP.</div><br><form id="conn"><div class="field"><label>Name</label><input name="name" required placeholder="SAP DEV"></div><div class="field"><label>Type</label><select name="type"><option>OData V2</option><option>OData V4</option><option>REST API</option></select></div><div class="field"><label>Base URL</label><input name="url" required placeholder="https://host/sap/opu/odata/sap/"></div><button class="btn primary">Save connection</button></form></section><section class="card"><div class="panel-head">Configured connections</div>${state.connections.map(x=>`<div class="connection"><div><strong><span class="dot ${x.status==='tested'?'ok':''}"></span>${esc(x.name)}</strong><div class="hint">${esc(x.type)} · ${esc(x.url)}</div></div><div><button class="btn small" data-test="${x.id}">Validate</button> <button class="btn small danger" data-rem="${x.id}">Remove</button></div></div>`).join('')}</section></div>`}
function settings(){return `<div class="card source-card" style="max-width:620px"><h3>Workspace</h3><div class="field"><label>Brand</label><input value="Invarture" disabled></div><div class="field"><label>Theme</label><input value="Invarture navy + blue" disabled></div><div class="field"><label>Persistence</label><input value="Browser localStorage" disabled></div><button class="btn danger" data-reset>Reset test workspace</button></div>`}
function previewModal(){let a=state.apps.find(x=>x.id===modal)||app();return `<div class="modal-bg" data-close><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><strong>${esc(a.name)} · Preview</strong><button class="btn small" data-close>Close</button></div><div class="modal-body"><div class="preview"><div class="runtime-head"><strong>${esc(a.name)}</strong><small>Invarture Runtime</small></div><div class="canvas-content">${a.components.map((c,i)=>component(c,i,false)).join('')}</div></div></div></div></div>`}
function def(t){let c={id:uid(),type:t};if(t==='title')c.text='New page title';if(t==='text')c.text='Add business context or instructions here.';if(t==='button')c.text='Action';if(t==='input')Object.assign(c,{label:'Field label',placeholder:'Enter value'});if(t==='card')Object.assign(c,{title:'Information',text:'Card content'});if(t==='kpi')Object.assign(c,{label:'Business KPI',value:'42'});if(t==='table')Object.assign(c,{columns:'ID,Name,Amount,Status'});if(t==='spacer')c.height=24;return c}
function wire(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;state.selected=null;save();render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.current=b.dataset.open;state.view='studio';state.selected=null;save();render()});document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{modal=b.dataset.preview;render()});document.querySelectorAll('[data-new]').forEach(b=>b.onclick=newApp);document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let c=def(b.dataset.add);app().components.push(c);state.selected=c.id;save();render()});document.querySelectorAll('[data-select]').forEach(e=>e.onclick=x=>{if(x.target.closest('button'))return;state.selected=e.dataset.select;render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();app().components=app().components.filter(x=>x.id!==b.dataset.del);if(state.selected===b.dataset.del)state.selected=null;save();render()});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=e=>{e.stopPropagation();let a=app().components,i=a.findIndex(x=>x.id===b.dataset.id),j=b.dataset.move==='up'?i-1:i+1;if(j>=0&&j<a.length)[a[i],a[j]]=[a[j],a[i]];save();render()});document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{state.device=b.dataset.device;save();render()});document.querySelectorAll('[data-prop]').forEach(e=>e.onchange=()=>{let c=app().components.find(x=>x.id===state.selected);if(c)c[e.dataset.prop]=e.type==='number'?Number(e.value):e.value;save();render()});document.querySelectorAll('[data-appfield]').forEach(e=>e.onchange=()=>{app()[e.dataset.appfield]=e.value;save();render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{modal=null;render()});document.getElementById('conn')?.addEventListener('submit',conn);document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{let c=state.connections.find(x=>x.id===b.dataset.test);if(c)c.status='tested';save();render();toast('Configuration validated locally')});document.querySelectorAll('[data-rem]').forEach(b=>b.onclick=()=>{state.connections=state.connections.filter(x=>x.id!==b.dataset.rem);save();render()});document.querySelector('[data-reset]')?.addEventListener('click',()=>{if(confirm('Reset local workspace?')){state=JSON.parse(JSON.stringify(base));save();render()}})}
function newApp(){let n=prompt('Application name:','New SAP Application');if(!n)return;let id=uid('app');state.apps.push({id,name:n,description:'New application created in Invarture App Studio.',status:'draft',components:[{id:uid(),type:'title',text:n}]});state.current=id;state.view='studio';save();render()}
function act(a){if(a==='save'){save();toast('Saved locally')}if(a==='preview'){modal=app().id;render()}if(a==='publish'){app().status=app().status==='published'?'draft':'published';save();render();toast('Application status updated')}if(a==='export'){let x=app(),blob=new Blob([JSON.stringify(x,null,2)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=x.id+'.json';l.click();URL.revokeObjectURL(l.href)}if(a==='import')document.getElementById('importFile').click()}
function conn(e){e.preventDefault();let f=new FormData(e.target);state.connections.push({id:uid('ds'),name:f.get('name'),type:f.get('type'),url:f.get('url'),status:'configured'});save();render();toast('Connection saved')}
document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.id||!x.name||!Array.isArray(x.components))throw Error('Invalid app schema');let i=state.apps.findIndex(a=>a.id===x.id);if(i>=0)state.apps[i]=x;else state.apps.push(x);state.current=x.id;state.view='studio';save();render();toast('Application imported')}catch(err){alert('Import failed: '+err.message)}e.target.value=''});render();
</script>
</body>
</html>
