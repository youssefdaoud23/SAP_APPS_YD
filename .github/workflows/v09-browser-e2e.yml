name: V0.9 Browser E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start complete Docker stack
        run: |
          docker compose up -d --build
          READY=0
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8081/healthz >/tmp/e2e-health.json; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = "1"
          grep '"ok":true' /tmp/e2e-health.json
          docker compose ps

      - name: Run Chromium E2E suite
        env:
          E2E_BASE_URL: http://127.0.0.1:8081
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Print diagnostics on failure
        if: failure()
        run: |
          echo '--- compose ps ---'
          docker compose ps || true
          echo '--- app logs ---'
          docker compose logs --no-color invarture-app-studio || true
          echo '--- postgres logs ---'
          docker compose logs --no-color postgres || true
          echo '--- health ---'
          cat /tmp/e2e-health.json || true

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
